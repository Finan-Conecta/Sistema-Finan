<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Sistema - Finan</title>
    <link rel="stylesheet" href="acesso-inicial.css">
</head>

<body>
    <div class="container">
        <img src="../imgs/LogoHorizontal.png" alt="Logo do Sistema Finan" class="logo">
        <h6>ACESSO RESTRITO</h6>
        <h1>Bem vinda de volta, AMAQ!</h1>
        <p>Insira o código de acesso da instituição para acessar o sistema financeiro Finan.</p>
        <form id="accessForm">
            <div class="acess-group">
                <label for="acessCode">Código de Acesso:<br></label>
                <input type="password" id="acessCode" name="acessCode" required>
            </div>
            <button type="submit">Entrar no sistema</button>
        </form>
    </div>

    <script src="acesso-inicial.js"></script>

</body>
</html>
