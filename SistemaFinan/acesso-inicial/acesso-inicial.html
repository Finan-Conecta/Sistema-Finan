<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Sistema - Finan</title>
    <link rel="stylesheet" href="acesso-inicial.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="accessMessage" class="toast" role="alert" aria-live="assertive">
    <i data-lucide="alert-circle"></i>
    <span id="toastText"></span>
    </div>
    <div class="container">
        <img src="../imgs/LogoHorizontal.png" alt="Logo do Sistema Finan" class="logo">
        <h6>ACESSO RESTRITO</h6>
        <h1>Bem vinda de volta, AMAQ!</h1>
        <p>Insira o código de acesso da associação para acessar o Sistema Finan.</p>
        
        <form id="accessForm">
            <div class="access-group">

                <label for="accessCode">Código de acesso:</label>

                <div class="password-container">

                <input type="password" id="accessCode" name="accessCode" placeholder="Digite seu código de acesso" required>

                <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar código de acesso">
                <i data-lucide="eye"></i>
                </button>

                </div>

    </div>

    <button type="submit">Entrar no sistema</button>

        </form>

    </div>

    <script src="acesso-inicial.js"></script>

</body>
</html>
